<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dziennik Pracy</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
            --selected-day: rgba(59, 130, 246, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            /* Bezpieczny odstęp od górnej krawędzi telefonu, żeby nagłówek nie był ucięty */
            padding: 12px 8px 8px 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        h1 { margin: 0; font-size: 1.1rem; color: var(--primary); }

        .layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 850px) {
            .layout { display: grid; grid-template-columns: 2fr 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
        }

        .card h2 {
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .cal-header button {
            background: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }

        .cal-day-head {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--text-sub);
            padding-bottom: 2px;
        }

        .cal-day {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 5px;
            height: 48px;
            padding: 2px;
            text-align: left;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            cursor: pointer;
        }

        .cal-day.empty { background: transparent; border: none; cursor: default; }
        .cal-day.selected { background: var(--selected-day); border-color: var(--primary); }
        .cal-day.today { border: 1.5px solid var(--accent-amber); }
        .cal-day.weekend { opacity: 0.6; background: #090d16; }

        .day-num { font-size: 0.7rem; font-weight: bold; }
        .day-info { display: flex; flex-direction: column; gap: 1px; }

        .day-badge {
            font-size: 0.55rem;
            padding: 1px;
            border-radius: 2px;
            text-align: center;
            line-height: 1;
        }

        .badge-shift { background: rgba(59, 130, 246, 0.3); color: #93c5fd; }
        .badge-earn { font-weight: bold; color: var(--accent-green); }
        .badge-urlop { background: rgba(6, 182, 212, 0.3); color: #67e8f9; }
        .badge-l4 { background: rgba(244, 63, 94, 0.3); color: #fda4af; }
        .badge-bezpl { background: rgba(148, 163, 184, 0.3); color: #cbd5e1; }

        .form-group { margin-bottom: 6px; }
        label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 2px; }
        input, select {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .checkbox-label input[type="checkbox"] { width: auto; }

        .row { display: flex; gap: 6px; }
        .row > div { flex: 1; }

        button.btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        button.btn-secondary {
            background: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .sum-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.8rem;
        }
        .sum-val { font-weight: bold; }
        .sum-total {
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--accent-green);
            margin-top: 8px;
            font-size: 1rem;
        }
        .sum-total .sum-val { color: var(--accent-green); }

        .selected-info {
            font-size: 0.75rem;
            color: var(--accent-amber);
            margin-bottom: 6px;
        }

        .collapsible-content { display: none; margin-top: 6px; }
        .collapsible-content.open { display: block; }
    </style>
</head>
<body>

<div class="header">
    <h1>Dziennik Pracy</h1>
</div>

<div class="layout">
    <div>
        <div class="card">
            <div class="cal-header">
                <button onclick="changeMonth(-1)">‹ Poprzedni</button>
                <h2 id="calMonthTitle" style="margin:0; font-size: 0.85rem;">Miesiąc</h2>
                <button onclick="changeMonth(1)">Następny ›</button>
            </div>
            
            <button class="btn-secondary" id="selectAllBtn" onclick="toggleSelectAllWorkdays()">Zaznacz robocze (bez weekendów)</button>

            <div class="cal-grid">
                <div class="cal-day-head">Pn</div>
                <div class="cal-day-head">Wt</div>
                <div class="cal-day-head">Śr</div>
                <div class="cal-day-head">Cz</div>
                <div class="cal-day-head">Pt</div>
                <div class="cal-day-head" style="color: #ef4444;">So</div>
                <div class="cal-day-head" style="color: #ef4444;">Nd</div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <div class="card" style="margin-top: 8px;">
            <h2>Zaznaczone dni</h2>
            <div class="selected-info" id="selectedDaysText">Kliknij dni na kalendarzu</div>
            
            <div class="form-group">
                <label>Typ Dnia / Status</label>
                <select id="dayTypeSelect" onchange="handleDayTypeChange()">
                    <option value="work">Praca (Standardowa)</option>
                    <option value="urlop">Urlop płatny</option>
                    <option value="l4">Zwolnienie lekarskie (L4 - 80%)</option>
                    <option value="bezplatny">Urlop bezpłatny</option>
                </select>
            </div>

            <div class="form-group">
                <label>Profil Zmiany</label>
                <select id="profileSelect" onchange="applyProfile()">
                    <option value="">-- Wybierz profil --</option>
                </select>
            </div>

            <div class="row" id="workInputRow">
                <div class="form-group">
                    <label>Godziny</label>
                    <input type="number" step="0.5" id="inputHours" placeholder="8">
                </div>
                <div class="form-group">
                    <label>Stawka/h (zł)</label>
                    <input type="number" step="0.01" id="inputRate" placeholder="31.40">
                </div>
            </div>

            <div class="row" style="margin-top: 4px;">
                <button class="btn-primary" onclick="saveSelectedDays()">Zapisz dni</button>
                <button class="btn-primary" style="background: #ef4444;" onclick="deleteSelectedDays()">Usuń</button>
            </div>
        </div>
    </div>

    <div>
        <div class="card">
            <h2>Podsumowanie Miesiąca</h2>
            <div class="sum-item">
                <span>Przepracowane godziny:</span>
                <span class="sum-val" id="sumHours">0 h</span>
            </div>
            <div class="sum-item">
                <span>Wypracowana podstawa:</span>
                <span class="sum-val" id="sumBase">0 zł</span>
            </div>

            <div style="margin-top: 8px; border-top: 1px dashed var(--card-border); padding-top: 6px;">
                <label style="color: var(--accent-amber); font-weight: bold;">Dodatki do miesiąca:</label>
                
                <div class="row" style="margin-top: 4px;">
                    <div class="form-group">
                        <label>Prowizja (zł)</label>
                        <input type="number" id="manualComm" placeholder="0" oninput="saveAndRecalculateExtras()">
                    </div>
                    <div class="form-group">
                        <label>Dodatek (zł)</label>
                        <input type="number" id="manualBonus" placeholder="0" oninput="saveAndRecalculateExtras()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Paliwówka (zł)</label>
                    <input type="number" id="manualFuel" placeholder="0" oninput="saveAndRecalculateExtras()">
                </div>
            </div>

            <div class="sum-item sum-total">
                <span id="sumTotalLabel">RAZEM (Brutto):</span>
                <span class="sum-val" id="sumTotal">0 zł</span>
            </div>
            <div id="nettoHint" style="font-size:0.75rem; color:var(--text-sub); margin-top:4px; display:none;">
                Wyliczenie na rękę (Netto): <b id="nettoTotalVal" style="color:var(--accent-green); font-size: 0.9rem;">0 zł</b>
            </div>
        </div>

        <div class="card" style="margin-top: 8px;">
            <h2>
                <span>Profile Zmian</span>
                <button class="toggle-btn" id="toggleProfilesBtn" onclick="toggleSection('profilesContent', 'toggleProfilesBtn')">▼ Rozwiń</button>
            </h2>
            <div class="collapsible-content" id="profilesContent">
                <div class="form-group">
                    <label>Nazwa profilu</label>
                    <input type="text" id="profName" placeholder="np. Zmiana Ranna">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Godziny</label>
                        <input type="number" step="0.5" id="profHours" placeholder="8">
                    </div>
                    <div class="form-group">
                        <label>Stawka/h (zł)</label>
                        <input type="number" step="0.01" id="profRate" placeholder="31.40">
                    </div>
                </div>
                <button class="btn-primary" style="background: var(--accent-purple); margin-top: 4px;" onclick="saveProfile()">Dodaj profil</button>
                <div id="profilesList" style="margin-top: 8px; font-size: 0.75rem;"></div>
            </div>
        </div>

        <div class="card" style="margin-top: 8px;">
            <h2>
                <span>Opcje i Ustawienia</span>
                <button class="toggle-btn" id="toggleSettingsBtn" onclick="toggleSection('settingsContent', 'toggleSettingsBtn')">▼ Rozwiń</button>
            </h2>
            <div class="collapsible-content" id="settingsContent">
                <label class="checkbox-label">
                    <input type="checkbox" id="fixedDodatekCheck" onchange="saveOptions()"> Stały dodatek co miesiąc
                </label>
                <div class="form-group" id="fixedDodatekValGroup" style="display:none;">
                    <label>Kwota stałego dodatku (zł)</label>
                    <input type="number" id="fixedDodatekValInput" placeholder="np. 200" oninput="saveOptions()">
                </div>

                <hr style="border:0; border-top:1px solid var(--card-border); margin: 8px 0;">

                <label class="checkbox-label">
                    <input type="checkbox" id="enableNettoCheck" onchange="saveOptions()"> Pokazuj przeliczenie na rękę (Netto / ZUS)
                </label>
                
                <div id="taxDetailsGroup" style="display:none;">
                    <div class="form-group">
                        <label>Rodzaj umowy / rozliczenia</label>
                        <select id="contractTypeSelect" onchange="saveOptions()">
                            <option value="uop">Umowa o pracę (Kalkulator składek ZUS + PIT)</option>
                            <option value="uz_student">Umowa zlecenie (Student < 26 lat - 0% potrąceń)</option>
                            <option value="uz_normal">Umowa zlecenie (Standardowy szacunek ZUS ~22%)</option>
                            <option value="custom">Własny % potrąceń (ZUS + PIT)</option>
                        </select>
                    </div>

                    <div class="form-group" id="customTaxGroup" style="display:none;">
                        <label>Łączny % potrąceń</label>
                        <input type="number" id="taxRateInput" placeholder="25" value="25" oninput="saveOptions()">
                    </div>
                </div>

                <hr style="border:0; border-top:1px solid var(--card-border); margin: 8px 0;">
                <button class="btn-secondary" style="background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); border: 1px solid var(--accent-rose);" onclick="clearAllHistory()">Wyczyść całą historię danych</button>
            </div>
        </div>
    </div>
</div>

<script>
    var currentDate = new Date();
    var selectedDates = [];

    function getData() { try { return JSON.parse(localStorage.getItem('work_data') || '{}'); } catch(e) { return {}; } }
    function saveData(data) { localStorage.setItem('work_data', JSON.stringify(data)); }
    
    function getExtras() { try { return JSON.parse(localStorage.getItem('work_extras') || '{}'); } catch(e) { return {}; } }
    function saveExtras(extras) { localStorage.setItem('work_extras', JSON.stringify(extras)); }

    function getProfiles() { try { return JSON.parse(localStorage.getItem('work_profiles') || '[]'); } catch(e) { return []; } }
    function saveProfiles(p) { localStorage.setItem('work_profiles', JSON.stringify(p)); }

    function getSettings() { try { return JSON.parse(localStorage.getItem('work_settings') || '{}'); } catch(e) { return {}; } }
    function saveSettings(s) { localStorage.setItem('work_settings', JSON.stringify(s)); }

    function clearAllHistory() {
        if (confirm('Czy na pewno chcesz wyczyścić całą historię pracy i ustawienia? Ta operacja jest nieodwracalna!')) {
            localStorage.removeItem('work_data');
            localStorage.removeItem('work_extras');
            localStorage.removeItem('work_profiles');
            localStorage.removeItem('work_settings');
            selectedDates = [];
            renderProfiles();
            renderCalendar();
            alert('Wszystkie dane zostały wyczyszczone.');
        }
    }

    function getCurrentMonthKey() {
        return currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0');
    }

    function renderCalendar() {
        var grid = document.getElementById('calGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();

        var monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
        document.getElementById('calMonthTitle').innerText = monthNames[month] + " " + year;

        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var startingDay = firstDay === 0 ? 6 : firstDay - 1;

        for (var i = 0; i < startingDay; i++) {
            var emptyCell = document.createElement('div');
            emptyCell.className = 'cal-day empty';
            grid.appendChild(emptyCell);
        }

        var data = getData();
        var todayObj = new Date();
        var todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth() + 1).padStart(2, '0') + '-' + String(todayObj.getDate()).padStart(2, '0');

        for (var day = 1; day <= daysInMonth; day++) {
            (function(dNum) {
                var dateObj = new Date(year, month, dNum);
                var dayOfWeek = dateObj.getDay();
                var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(dNum).padStart(2, '0');
                
                var dayEl = document.createElement('div');
                dayEl.className = 'cal-day';
                if (dayOfWeek === 0 || dayOfWeek === 6) dayEl.className += ' weekend';
                if (dateStr === todayStr) dayEl.className += ' today';
                if (selectedDates.indexOf(dateStr) > -1) dayEl.className += ' selected';

                var html = '<div class="day-num">' + dNum + '</div>';

                if (data[dateStr]) {
                    var entry = data[dateStr];
                    var t = entry.type || 'work';
                    var h = entry.hours || 0;
                    var r = entry.rate || 0;
                    var earn = 0;

                    if (t === 'work' || t === 'urlop') earn = h * r;
                    else if (t === 'l4') earn = (h * r) * 0.8;
                    else if (t === 'bezplatny') earn = 0;

                    html += '<div class="day-info">';
                    if (t === 'work') {
                        html += '<span class="day-badge badge-shift">' + h + 'h</span>';
                        html += '<span class="day-badge badge-earn">' + Math.round(earn) + 'zł</span>';
                    } else if (t === 'urlop') {
                        html += '<span class="day-badge badge-urlop">Urlop</span>';
                        html += '<span class="day-badge badge-earn">' + Math.round(earn) + 'zł</span>';
                    } else if (t === 'l4') {
                        html += '<span class="day-badge badge-l4">L4 (80%)</span>';
                        html += '<span class="day-badge badge-earn">' + Math.round(earn) + 'zł</span>';
                    } else if (t === 'bezplatny') {
                        html += '<span class="day-badge badge-bezpl">Bezpłatny</span>';
                    }
                    html += '</div>';
                }

                dayEl.innerHTML = html;
                dayEl.onclick = function() { toggleDateSelection(dateStr); };
                grid.appendChild(dayEl);
            })(day);
        }

        loadOptionsAndExtras();
        updateSummary();
    }

    function toggleDateSelection(dateStr) {
        var index = selectedDates.indexOf(dateStr);
        if (index > -1) selectedDates.splice(index, 1);
        else selectedDates.push(dateStr);
        updateSelectedText();
        renderCalendar();
    }

    function toggleSelectAllWorkdays() {
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();
        var daysInMonth = new Date(year, month + 1, 0).getDate();

        var workdays = [];
        for (var day = 1; day <= daysInMonth; day++) {
            var dateObj = new Date(year, month, day);
            var dayOfWeek = dateObj.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                workdays.push(year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0'));
            }
        }

        var btn = document.getElementById('selectAllBtn');
        var allSelected = true;
        for (var i = 0; i < workdays.length; i++) {
            if (selectedDates.indexOf(workdays[i]) === -1) { allSelected = false; break; }
        }

        if (allSelected) {
            selectedDates = selectedDates.filter(function(d) { return workdays.indexOf(d) === -1; });
            if (btn) btn.innerText = "Zaznacz robocze (bez weekendów)";
        } else {
            for (var j = 0; j < workdays.length; j++) {
                if (selectedDates.indexOf(workdays[j]) === -1) selectedDates.push(workdays[j]);
            }
            if (btn) btn.innerText = "Odznacz wszystkie dni";
        }

        updateSelectedText();
        renderCalendar();
    }

    function updateSelectedText() {
        var txt = document.getElementById('selectedDaysText');
        if (txt) txt.innerText = selectedDates.length > 0 ? 'Liczba zaznaczonych dni: ' + selectedDates.length : 'Kliknij dni na kalendarzu';
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        selectedDates = [];
        var btn = document.getElementById('selectAllBtn');
        if (btn) btn.innerText = "Zaznacz robocze (bez weekendów)";
        renderCalendar();
    }

    function toggleSection(contentId, btnId) {
        var content = document.getElementById(contentId);
        var btn = document.getElementById(btnId);
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            btn.innerText = '▼ Rozwiń';
        } else {
            content.classList.add('open');
            btn.innerText = '▲ Zwiń';
            // Automatyczne płynne przewinięcie ekranu do rozwijanej sekcji
            setTimeout(function() {
                content.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }
    }

    function handleDayTypeChange() {
        var val = document.getElementById('dayTypeSelect').value;
        var row = document.getElementById('workInputRow');
        if (val === 'bezplatny') {
            row.style.display = 'none';
        } else {
            row.style.display = 'flex';
        }
    }

    function saveProfile() {
        var name = document.getElementById('profName').value;
        var hours = parseFloat(document.getElementById('profHours').value) || 0;
        var rate = parseFloat(document.getElementById('profRate').value) || 0;
        if (!name) return alert('Wpisz nazwę profilu');
        var profiles = getProfiles();
        profiles.push({ id: Date.now(), name: name, hours: hours, rate: rate });
        saveProfiles(profiles);
        document.getElementById('profName').value = '';
        document.getElementById('profHours').value = '';
        document.getElementById('profRate').value = '';
        renderProfiles();
    }

    function deleteProfile(id) {
        var profiles = getProfiles();
        profiles = profiles.filter(function(p) { return p.id !== id; });
        saveProfiles(profiles);
        renderProfiles();
    }

    function renderProfiles() {
        var profiles = getProfiles();
        var select = document.getElementById('profileSelect');
        var list = document.getElementById('profilesList');
        select.innerHTML = '<option value="">-- Wybierz profil --</option>';
        
        if (profiles.length === 0) {
            list.innerHTML = 'Brak zapisanych profili.';
            return;
        }

        var html = '<b>Zapisane profile:</b><br>';
        for (var i = 0; i < profiles.length; i++) {
            var p = profiles[i];
            select.innerHTML += '<option value="' + p.id + '">' + p.name + ' (' + p.hours + 'h / ' + p.rate + 'zł)</option>';
            html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; background:#0f172a; padding:4px 6px; border-radius:4px;">';
            html += '<span>• <b>' + p.name + '</b>: ' + p.hours + 'h @ ' + p.rate + ' zł/h</span>';
            html += '<button onclick="deleteProfile(' + p.id + ')" style="background:#ef4444; color:white; border:none; border-radius:3px; padding:2px 6px; font-size:0.65rem; cursor:pointer;">Usuń</button>';
            html += '</div>';
        }
        list.innerHTML = html;
    }

    function applyProfile() {
        var profId = document.getElementById('profileSelect').value;
        if (!profId) return;
        var profiles = getProfiles();
        for (var i = 0; i < profiles.length; i++) {
            if (profiles[i].id == profId) {
                document.getElementById('inputHours').value = profiles[i].hours;
                document.getElementById('inputRate').value = profiles[i].rate;
                break;
            }
        }
    }

    function saveSelectedDays() {
        if (selectedDates.length === 0) return alert('Zaznacz dni na kalendarzu!');
        var type = document.getElementById('dayTypeSelect').value;
        var hours = type === 'bezplatny' ? 0 : (parseFloat(document.getElementById('inputHours').value) || 0);
        var rate = parseFloat(document.getElementById('inputRate').value) || 0;
        
        var data = getData();
        for (var i = 0; i < selectedDates.length; i++) { 
            data[selectedDates[i]] = { type: type, hours: hours, rate: rate }; 
        }
        saveData(data);
        renderCalendar();
    }

    function deleteSelectedDays() {
        if (selectedDates.length === 0) return alert('Zaznacz dni do usunięcia');
        var data = getData();
        for (var i = 0; i < selectedDates.length; i++) { delete data[selectedDates[i]]; }
        saveData(data);
        renderCalendar();
    }

    function loadOptionsAndExtras() {
        var settings = getSettings();
        var extras = getExtras();
        var monthKey = getCurrentMonthKey();
        var m = extras[monthKey] || {};

        document.getElementById('fixedDodatekCheck').checked = settings.isFixedDodatek || false;
        document.getElementById('fixedDodatekValInput').value = settings.fixedDodatekVal || '';
        document.getElementById('fixedDodatekValGroup').style.display = settings.isFixedDodatek ? 'block' : 'none';

        document.getElementById('enableNettoCheck').checked = settings.enableNetto || false;
        document.getElementById('contractTypeSelect').value = settings.contractType || 'uop';
        document.getElementById('taxRateInput').value = settings.taxRate || 25;

        var detailsDisplay = settings.enableNetto ? 'block' : 'none';
        document.getElementById('taxDetailsGroup').style.display = detailsDisplay;
        document.getElementById('customTaxGroup').style.display = (settings.enableNetto && settings.contractType === 'custom') ? 'block' : 'none';

        document.getElementById('manualComm').value = m.comm || '';
        document.getElementById('manualFuel').value = m.fuel || '';

        if (settings.isFixedDodatek) {
            document.getElementById('manualBonus').value = settings.fixedDodatekVal || '';
        } else {
            document.getElementById('manualBonus').value = m.bonus || '';
        }
    }

    function saveOptions() {
        var isFixed = document.getElementById('fixedDodatekCheck').checked;
        var fixedVal = parseFloat(document.getElementById('fixedDodatekValInput').value) || 0;
        var enableNetto = document.getElementById('enableNettoCheck').checked;
        var contractType = document.getElementById('contractTypeSelect').value;
        var taxRate = parseFloat(document.getElementById('taxRateInput').value) || 0;

        document.getElementById('fixedDodatekValGroup').style.display = isFixed ? 'block' : 'none';
        document.getElementById('taxDetailsGroup').style.display = enableNetto ? 'block' : 'none';
        document.getElementById('customTaxGroup').style.display = (enableNetto && contractType === 'custom') ? 'block' : 'none';

        var settings = {
            isFixedDodatek: isFixed,
            fixedDodatekVal: fixedVal,
            enableNetto: enableNetto,
            contractType: contractType,
            taxRate: taxRate
        };
        saveSettings(settings);

        if (isFixed) {
            document.getElementById('manualBonus').value = fixedVal;
        }

        updateSummary();
    }

    function saveAndRecalculateExtras() {
        var extras = getExtras();
        var monthKey = getCurrentMonthKey();
        
        if (!extras[monthKey]) extras[monthKey] = {};
        
        extras[monthKey].comm = parseFloat(document.getElementById('manualComm').value) || 0;
        extras[monthKey].bonus = parseFloat(document.getElementById('manualBonus').value) || 0;
        extras[monthKey].fuel = parseFloat(document.getElementById('manualFuel').value) || 0;

        saveExtras(extras);
        updateSummary();
    }

    function calculateNetto(gross, contractType, customRate) {
        if (contractType === 'uz_student') return gross;
        
        if (contractType === 'uop') {
            var zusSpoleczne = gross * 0.1371;
            var podstawaZdrowotna = gross - zusSpoleczne;
            var skladkaZdrowotna = podstawaZdrowotna * 0.09;
            var podstawaOpodatkowania = podstawaZdrowotna - 250;
            if (podstawaOpodatkowania < 0) podstawaOpodatkowania = 0;
            
            var zaliczkaPit = (podstawaOpodatkowania * 0.12) - 300;
            if (zaliczkaPit < 0) zaliczkaPit = 0;
            
            var netto = gross - zusSpoleczne - skladkaZdrowotna - zaliczkaPit;
            return netto > 0 ? netto : 0;
        }
        
        if (contractType === 'uz_normal') {
            return gross * 0.78;
        }
        
        if (contractType === 'custom') {
            var effectiveTaxRate = (customRate || 0) / 100;
            return gross * (1 - effectiveTaxRate);
        }

        return gross;
    }

    function updateSummary() {
        var data = getData();
        var monthKey = getCurrentMonthKey();
        var hours = 0, base = 0;

        for (var d in data) {
            if (d.indexOf(monthKey) === 0) {
                var item = data[d];
                var t = item.type || 'work';
                var h = item.hours || 0;
                var r = item.rate || 0;

                if (t === 'work') {
                    hours += h;
                    base += h * r;
                } else if (t === 'urlop') {
                    hours += h;
                    base += h * r;
                } else if (t === 'l4') {
                    hours += h;
                    base += (h * r) * 0.8;
                } else if (t === 'bezplatny') {
                    // 0 godzin i 0 zł
                }
            }
        }

        var comm = parseFloat(document.getElementById('manualComm').value) || 0;
        var bonus = parseFloat(document.getElementById('manualBonus').value) || 0;
        var fuel = parseFloat(document.getElementById('manualFuel').value) || 0;

        var totalGross = base + comm + bonus + fuel;

        document.getElementById('sumHours').innerText = hours + ' h';
        document.getElementById('sumBase').innerText = Math.round(base) + ' zł';
        document.getElementById('sumTotal').innerText = Math.round(totalGross) + ' zł';

        var settings = getSettings();
        var nettoHint = document.getElementById('nettoHint');

        if (settings.enableNetto) {
            nettoHint.style.display = 'block';
            var netVal = calculateNetto(totalGross, settings.contractType, settings.taxRate);
            document.getElementById('nettoTotalVal').innerText = Math.round(netVal) + ' zł';
        } else {
            nettoHint.style.display = 'none';
        }
    }

    // Inicjalizacja przy starcie
    window.onload = function() {
        renderProfiles();
        renderCalendar();
    };
</script>
</body>
