<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendarz Zmianowy</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input, select {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 15px;
        }

        .calendar-day {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 6px;
            text-align: center;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .calendar-day span {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .shift-tag {
            font-size: 0.75rem;
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .expandable-section {
            margin-top: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .expandable-header {
            background: #f8fafc;
            padding: 14px 16px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expandable-content {
            padding: 16px;
            display: none;
            border-top: 1px solid var(--border);
            background: #fff;
        }

        .expandable-content.active {
            display: block;
        }

        /* Ogromny zapas miejsca na samym dole pod telefon */
        .bottom-spacer {
            height: 180px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Harmonogram i Kalendarz Zmian</h1>

        <!-- Sekcja Profili i Typów Dnia -->
        <div class="section">
            <h2>Konfiguracja Zmian</h2>
            <div class="form-row">
                <input type="text" id="profileNameInput" placeholder="Nazwa profilu (np. Rano, Popołudnie)">
                <button onclick="addProfile()">Dodaj Profil</button>
            </div>
            <div id="profilesList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
        </div>

        <!-- Sekcja Kalendarza -->
        <div class="section">
            <h2>Kalendarz (Bieżący Miesiąc)</h2>
            <p style="font-size: 0.9rem; color: var(--text-light); text-align: center;">Kliknij na dzień, aby przypisać profil zmian.</p>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- Rozwijane menu na samym dole – teraz ma mnóstwo miejsca pod spodem na telefonie -->
        <div class="expandable-section">
            <div class="expandable-header" onclick="toggleExpand()">
                <span>Ostatnie okno / Ustawienia zaawansowane</span>
                <span id="expandIcon">▼</span>
            </div>
            <div class="expandable-content" id="expandContent">
                <p style="margin-top: 0; color: var(--text-light);">Zarządzaj dodatkowymi opcjami, eksportem lub podsumowaniem.</p>
                <button onclick="alert('Wykonano akcję z ostatniego okna!')" style="width: 100%;">Zatwierdź ustawienia</button>
            </div>
        </div>

    </div>

    <!-- Przestrzeń na dole zapobiegająca problemom z klikaniem na telefonach -->
    <div class="bottom-spacer"></div>

    <script>
        let profiles = JSON.parse(localStorage.getItem('shift_profiles')) || ['Rano', 'Popołudnie', 'Noc', 'Wolne'];
        let schedule = JSON.parse(localStorage.getItem('shift_schedule')) || {};

        function saveData() {
            localStorage.setItem('shift_profiles', JSON.stringify(profiles));
            localStorage.setItem('shift_schedule', JSON.stringify(schedule));
        }

        function renderProfiles() {
            const container = document.getElementById('profilesList');
            container.innerHTML = '';
            profiles.forEach((p, index) => {
                container.innerHTML += `<span style="background:#e0e7ff; color:#3730a3; padding:6px 12px; border-radius:6px; font-size:0.9rem; display:inline-flex; align-items:center; gap:6px;">
                    ${p} <b onclick="deleteProfile(${index})" style="cursor:pointer; color:#ef4444;">&times;</b>
                </span>`;
            });
        }

        function addProfile() {
            const input = document.getElementById('profileNameInput');
            const val = input.value.trim();
            if(val && !profiles.includes(val)) {
                profiles.push(val);
                input.value = '';
                saveData();
                renderProfiles();
            }
        }

        function deleteProfile(index) {
            profiles.splice(index, 1);
            saveData();
            renderProfiles();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            // Przykładowy miesiąc 30 dni
            for(let i = 1; i <= 30; i++) {
                const shift = schedule[i] || '-';
                grid.innerHTML += `
                    <div class="calendar-day" onclick="changeDayShift(${i})">
                        <span>${i}</span>
                        <div class="shift-tag">${shift}</div>
                    </div>
                `;
            }
        }

        function changeDayShift(day) {
            let current = schedule[day] || 'Brak';
            let nextIndex = profiles.indexOf(current) + 1;
            if (nextIndex >= profiles.length) nextIndex = 0;
            schedule[day] = profiles[nextIndex] || profiles[0];
            saveData();
            renderCalendar();
        }

        function toggleExpand() {
            const content = document.getElementById('expandContent');
            const icon = document.getElementById('expandIcon');
            content.classList.toggle('active');
            icon.textContent = content.classList.contains('active') ? '▲' : '▼';
        }

        // Inicjalizacja
        renderProfiles();
        renderCalendar();
    </script>
</body>
</html>
